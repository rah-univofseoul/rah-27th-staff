<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
:root{--page:#f7f7f5;--paper:#fff;--ink:#252525;--sub:#5f6262;--faint:#888b89;--rule:#e5e5e1;--tint:#f4f4f1;--radius:15px}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,input,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #555;outline-offset:3px}
#app{max-width:1040px;margin:0 auto;padding:0 36px 54px}
.sitebar{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule)}
.logotype{font-size:25px;font-weight:800;letter-spacing:-.065em;line-height:1}.logotype:hover{opacity:.75}
.sitebar-right{display:flex;align-items:center;gap:14px;color:var(--sub);font-size:12px}.sitebar-right span+span{padding-left:14px;border-left:1px solid var(--rule)}
.site-intro{padding:29px 0 21px}
.site-eyebrow{color:var(--faint);font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.site-intro h1{font-size:30px;font-weight:760;letter-spacing:-.057em;line-height:1.22;margin:0 0 7px}
.site-intro p{margin:0;color:var(--sub);font-size:13px}
.tabbar{display:flex;gap:0;border-bottom:1px solid #dcdcd8;margin-bottom:33px}
.tab{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px 13px;color:#838583;font-weight:620;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.active{color:#222;border-color:#222}
main{min-height:440px}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:22px}
.eyebrow{margin:0 0 5px;color:var(--faint);font-size:11px;font-weight:650;letter-spacing:.06em}
.pagehead h2,.detailhead h2{font-size:32px;letter-spacing:-.053em;line-height:1.23;font-weight:760;margin:0}
.pagehead p,.detailhead p{margin:7px 0 0;font-size:14px;color:var(--sub)}
.count-label{padding:6px 11px;border:1px solid var(--rule);border-radius:100px;color:#555;font-size:12px;white-space:nowrap;background:var(--paper)}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dcdcd8;border-radius:10px;padding:0 15px;height:52px;margin-bottom:15px}
.search:focus-within{border-color:#8d8e8b}.search svg{width:17px;height:17px;color:#878987;flex-shrink:0}
.search input{flex:1;width:100%;min-width:0;outline:0;border:0;background:none;font-size:14px;color:var(--ink)}.search input::placeholder{color:#a1a3a0}
.people-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.person-tile{background:var(--paper);border:1px solid var(--rule);border-radius:11px;min-height:88px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:border-color .14s,transform .14s}
.person-tile:hover{border-color:#b8b9b6;transform:translateY(-1px)}
.person-tile-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.person-tile strong{font-size:17px;line-height:1.2;font-weight:680;letter-spacing:-.03em}
.tile-arrow{font-size:17px;color:#a6a8a5}.person-tile small{font-size:12px;color:var(--faint)}
.filter-scroll{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding-bottom:12px;margin:2px 0 7px}.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip{flex:none;border:1px solid var(--rule);border-radius:999px;background:#fff;color:#70716f;padding:8px 13px;font-size:12px;font-weight:600}
.filter-chip.selected{background:#292929;color:white;border-color:#292929}
.manual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.manual-tile{min-width:0;display:grid;grid-template-columns:36px minmax(0,1fr) 16px;gap:9px;align-items:center;padding:15px;background:#fff;border:1px solid var(--rule);border-radius:11px;min-height:79px;transition:border-color .14s}
.manual-tile:hover{border-color:#b3b5b1}.manual-no{font-size:12px;color:#aaa;font-variant-numeric:tabular-nums}.manual-tile h3{font-size:15px;line-height:1.4;font-weight:660;margin:0;letter-spacing:-.022em}.manual-tile p{font-size:11px;color:var(--faint);margin:2px 0 0}.manual-tile .tile-arrow{font-size:19px}
.breadcrumb{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--faint);margin-bottom:22px}.breadcrumb a{color:#666}.breadcrumb a:hover{text-decoration:underline}
.detailhead{border-bottom:1px solid var(--rule);padding-bottom:22px;margin-bottom:20px}.detailhead h2{font-size:38px}.detailhead p{line-height:1.7}
.meta-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:13px;color:#727371;font-size:12px}
.meta-line span{padding:5px 9px;border:1px solid var(--rule);background:#fff;border-radius:6px}
.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:25px 0 13px}
.section-title-row h3{font-size:17px;letter-spacing:-.025em;margin:0}.section-title-row small{font-size:12px;color:var(--faint)}
.schedule-board,.manual-board,.notice-board{border:1px solid var(--rule);border-radius:13px;overflow:hidden;background:#fff}
.schedule-row{display:grid;grid-template-columns:162px minmax(0,1fr) 155px;align-items:start;gap:20px;padding:19px 22px;border-bottom:1px solid var(--rule)}
.schedule-row:last-child{border-bottom:0}
.when-time{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.4;margin:1px 0 5px}.when-stage{font-size:12px;line-height:1.5;color:var(--faint)}
.schedule-job{font-size:16px;line-height:1.4;font-weight:660;letter-spacing:-.026em;margin:0 0 6px}
.schedule-place{font-size:13px;color:var(--sub);margin:0}.schedule-note{font-size:12px;color:#666;margin:6px 0 0;white-space:pre-line}
.manual-action{justify-self:end;border:1px solid var(--rule);border-radius:8px;padding:7px 9px;font-size:12px;color:#555;white-space:nowrap;line-height:1.2;background:#fafaf9}
.manual-action:hover{border-color:#999}
.manual-actions{justify-self:end;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:96px;max-width:155px;width:100%}
.manual-actions .manual-action{display:block;justify-self:stretch;text-align:center;white-space:normal;overflow-wrap:anywhere}
.manual-missing{font-size:11px;color:#8c5537;text-align:center;line-height:1.45}
.muted-note{font-size:12px;color:var(--faint);line-height:1.7;margin:13px 2px 0}
.manual-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;padding:19px 24px;border-bottom:1px solid var(--rule)}
.manual-row:last-child{border-bottom:0}
.manual-row.toprow{background:#f9f9f7}.manual-row.important{background:#fcfaf7}
.manual-label{font-size:13px;font-weight:690;color:#646665;padding-top:1px;line-height:1.6}
.manual-value{font-size:14px;line-height:1.82;color:#282929;white-space:pre-wrap;overflow-wrap:anywhere}
.manual-row.important .manual-label{color:#8c5537}
.manual-value.empty-value{color:#aaa}
.manual-steps{margin:0;padding:0;list-style:none;display:grid;gap:9px;white-space:normal}
.manual-steps li{display:grid;grid-template-columns:19px 1fr;gap:7px;align-items:start}
.manual-steps .step-num{font-size:12px;font-variant-numeric:tabular-nums;color:#999;font-weight:700;margin-top:3px}
.detailbottom{display:flex;justify-content:space-between;gap:16px;margin:24px 0 0;font-size:13px;color:#555}
.detailbottom a:hover{text-decoration:underline}
.notice-board{padding:0 23px;margin-bottom:14px}
.notice-head{margin:0;padding:18px 0 10px;font-size:17px;font-weight:710;letter-spacing:-.025em}
.notice-line{border-top:1px solid var(--rule);padding:13px 0;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;font-size:14px}
.notice-line strong{font-size:14px;font-variant-numeric:tabular-nums;font-weight:710}.notice-line p{margin:0;color:#575a58}
.notice-bullets{padding:0 0 14px;margin:0;list-style:none}.notice-bullets li{padding:12px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.7}
.notice-bullets li:before{content:'·';font-weight:800;margin-right:8px}
.notice-note{padding:16px 20px;background:#fff;border:1px solid var(--rule);border-radius:12px;font-size:13px;color:#565957;line-height:1.8;margin-top:12px}
.notice-note strong{color:#292929}
.empty{padding:40px 20px;text-align:center;font-size:14px;border:1px solid var(--rule);border-radius:12px;background:#fff;color:var(--sub);grid-column:1/-1}
.sitefoot{border-top:1px solid var(--rule);margin-top:70px;padding-top:21px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;font-size:12px;color:var(--faint)}
.sitefoot p{margin:0 0 5px}.sitefoot a{color:#656765}.sitefoot a:hover{text-decoration:underline}

 .notice-board{padding:0 16px}.notice-line{grid-template-columns:100px 1fr;gap:10px;font-size:13px}.notice-line strong{font-size:13px}.sitefoot{margin-top:45px;display:block}.sitefoot a{display:inline-block;margin-top:7px}

@media(max-width:350px){.sitebar-right .date{display:none}.tab{font-size:12px}.people-grid{gap:7px}}
</style>
</head>

당자가 곧바로 해결 예정","handoff":"교대자에게 현재 상황과 미해결 문제를 전달한 뒤 이동한다.","comms":"일반 이슈: 스태프톡 → 해당 분야 담당 → 필요 시 김윤수·손민지","cautions":"• 본인 무대 준비가 우선이며 복귀할 때 담당자에게 즉시 보고\n• 현장 동선 및 최종 큐콜 지시가 표의 예상시간보다 우선","assigned":"공연 당일 전 시간대: 전 스태프(각자 맡은 구역 담당)\n전체 현장 총괄: 김윤수·손민지"},{"name":"임원진 콜·준비물 점검","category":"사전 설치","purpose":"공연 운영에 필요한 준비물을 누락 없이 공연장으로 이동시킨다.","place":"동아리방 / 준비물 목록","prep":"• 07:50 임원진 콜\n• 인쇄물, 음원·영상, 인포 물품, 케이터링, 설치 물품 목록 확인","steps":"1. 담당별 준비물을 개수 및 상태까지 확인한다.\n2. 누락·고장 물품을 즉시 총괄에 알린다.\n3. 짐을 기능별로 분류하여 운반 준비한다.","handoff":"08:30 공연장 이동조에 품목별로 전달하고 적재 여부 확인.","comms":"총괄 김윤수·손민지","cautions":"• 품목은 임의로 생략하지 않음\n• 최종 음원·영상 파일 접근 가능 여부도 출발 전 확인(변정암, 엄지민)","assigned":"07:50 임원진 콜: 김윤수·손민지 중심, 임원진 전원"},{"name":"공연장 이동·짐 운반","category":"사전 설치","purpose":"장비와 물품을 안전하게 공연장 각 설치 구역에 전달한다.","place":"동아리방 → 예림당아트홀","prep":"• 운반 목록·수량·차량 또는 이동조 확인","steps":"1. 물품을 파손되지 않도록 분류해 운반한다.\n2. 도착 즉시 물품을 설치조에 각각 전달한다.\n3. 이동 물품이 전부 도착했는지 최종 확인한다.","handoff":"각 설치조에 인수인계 후 지정 설치 업무로 전환.","comms":"누락·파손 발생 시 김윤수·손민지","cautions":"• 공연장 통행로에 박스 방치 금지\n• 이동시간 예상보다 지연 시 톡방 즉시 공유","assigned":"08:30~10:00 공연장 이동: 임원진 전원"},{"name":"여자 탈의실 가림막 설치","category":"사전 설치","purpose":"공연진의 탈의 공간을 가리고 동선·안전 문제를 예방한다.","place":"여자 탈의실 / 가림막·고정 물품","prep":"• 설치 위치와 출입문·통로 확인\n• 스태프 담당 구역 확인","steps":"1. 가림막을 통행·비상 동선을 막지 않는 위치에 설치한다.\n2. 넘어짐·틈새·고정 상태를 확인한다.\n3. 탈의실 상주 담당자에게 설치 상태를 설명한다.","handoff":"설치 완료 후 정리 및 총괄 보고, 이후 유동지원.","comms":"설치 문제 → 손민지 또는 현장 총괄","cautions":"• 공연진 프라이버시 보호\n• 파손 방지를 위해 임의 이동 금지","assigned":"10:00 설치: 손민지, 이세영, 서연우, 최영서, 이채원"},{"name":"포스터·포토월·데코레이션 설치","category":"사전 설치","purpose":"공연 공간의 홍보물과 포토월을 배치하고 관객 동선을 확보한다.","place":"건물 내외부 / 로비·공연장 / 포스터·부착 도구·장식","prep":"• 홍보물 종류별 수량·설치 예정 위치 확인\n• 담당자 정수인에게 할일 분담 받기","steps":"1. 포스터·포토월·장식을 지정 위치에 설치한다.\n2. 부착 상태와 가독성을 관객 시점에서 확인한다.\n3. 주요 동선을 방해하지 않는지 확인한다.\n4. 담당자 정수인의 컨펌을 받는다.(모든 설치 완료 시 정수인은 최종 확인 김윤수에게)","handoff":"남은 자재 회수·정리하고 완료 후 유동지원.","comms":"정수인 → 김윤수 최종 확인","cautions":"• 벽면·시설물 훼손 금지\n• 출입 및 대기 줄 통로 확보","assigned":"10:00 설치: 정수인, 김소연, 문지윤, 홍주연, 백정욱, 정서연\n최종 확인: 김윤수"},{"name":"인포·입장데스크 세팅","category":"사전 설치","purpose":"예매 확인·현장예매·꽃 보관 업무를 관객 입장 전에 사용할 수 있게 한다.","place":"인포·입구 / 예매 시트·좌석표(프린트)·팜플렛·안내문·포스트잇(꽃다발용)","prep":"• 예매 시트 접근·편집 권한 확인\n• 잔여석·현매 계좌 확인","steps":"1. 티켓 체크용 화면 및 좌석표를 준비한다.\n2. 두 입장 처리 위치의 동선과 담당자를 정한다.\n3. 팜플렛 전달 및 좌석 안내 방식 확인 및 연습.\n4. 현장 예매 계좌 안내와 입금확인 방식 확인.","handoff":"16:00~16:20 최종 점검 담당자에게 정상작동 여부 인계.","comms":"인포·회계 안재우 / 최종 점검 김윤수","cautions":"• 관객에게 계좌·좌석·예매 시트 개인정보가 노출되지 않게 화면 위치 세팅","assigned":"10:00 설치: 안재우, 조유빈, 김소혜\n16:00~16:20 최종 점검: 정수인, 오서하, 이승민"},{"name":"무대·대기 동선 표시·넘버링","category":"사전 설치","purpose":"공연진이 통로→하수대기실→직전대기→무대 순으로 이동할 수 있게 한다.","place":"무대·백스테이지 / 형광테이프·번호표","prep":"• 3전·2전·직전 대기 위치 정확히 확인\n• 주최측 승인된 표시 위치 확인","steps":"1. 통로(3전), 하수대기실(2전), 직전대기(실제 하수·직전팀) 위치를 표시한다.\n2. 공연진 이동 방향·넘버링을 눈에 띄게 부착한다.\n3. 실제 팀 이동을 가정해 동선을 점검한다.\n4. 대기실/통로 잘 보이는 곳에 무대 순서 표를 부착한다.","handoff":"백스테이지 통로·대기 담당자에게 위치 설명 후 전달.","comms":"손민지·백스테이지 담당","cautions":"• 출입문·장비·안전 동선 훼손 금지\n• 무대 바닥 표시가 미끄러지지 않게 확인","assigned":"10:00 설치: 윤승현, 오서하, 차수연, 김서윤"},{"name":"객석 표시·좌석 안내 동선 세팅","category":"사전 설치","purpose":"관객이 예매 좌석을 빠르게 찾도록 객석을 정리한다.","place":"객석 / 좌석표·행·열 표식","prep":"• 좌석 배치와 입구 확인","steps":"1. 객석 좌석번호·행·열 표기를 확인한다.\n2. 안내 스태프가 서 있을 위치와 관객 이동 동선을 확인한다.\n3. 좌석 표기 오류·시야 가림을 점검한다.\n4. 계단 등 주요 관객 이동 동선에 형광 테이프를 바닥에 잘 부착한다.","handoff":"객석 담당자(정서연)에게 좌석 구조 및 주의 구간 인계\n최종 완료 후 김윤수에게 확인.","comms":"좌석 안내 담당 → 현장 총괄","cautions":"• 이동 중 공연장 시설·좌석 훼손 금지\n• 비상 통로 점유 금지","assigned":"10:00 설치: 이승민, 이지호, 김민기, 박민찬, 박시영, 임도규, 장민혁, 최대은"},{"name":"FOH 음향·화면 사전 세팅","category":"기술·리허설","purpose":"리허설 및 본 공연에 사용할 음원·영상·마이크가 문제없이 작동하도록 한다.","place":"FOH(조정실)·무대 / 재생기기·음원·영상·마이크","prep":"• 최종 파일·재생 순서·필요 케이블 확인\n• 조명·공연장 기술팀과 연결 상태 확인","steps":"1. 잭·화면·스피커·마이크를 연결하고 테스트한다.\n2. 무대별 음원 및 화면 파일을 순서대로 점검한다.\n3. 오류 파일·동기화 문제를 기록해 담당자에게 즉시 공유한다.\n4. 큐 실행 시 멈춤·전환 방법을 함께 꼭!! 확인한다.","handoff":"담당 부별 음향·화면·AV보조 담당에게 세팅 상태와 오류 목록 인계.","comms":"변정암(음향)·엄지민(화면)·조성미(AV보조) / 큐콜 손민지·홍주연","cautions":"• 테스트 중 임의 볼륨 변경·콘솔 조작 자제\n• 본 공연 전에 실제 화면 넘김 타이밍 확인 필수\n• 리허설 동안 충분히 연습","assigned":"10:00 기술 세팅: 변정암(음향), 엄지민(화면), 조성미(AV보조)"},{"name":"공연진·MC 도착 안내","category":"도착·지원","purpose":"공연진과 MC가 대기 장소 및 당일 진행사항을 알도록 돕는다.","place":"로비·대기구역 / 콜타임·대기장소 안내","prep":"• 11:30 공연진·MC 콜 확인\n• MC 대기 및 동선 사전 파악","steps":"1. 도착 인원을 확인해 대기 위치(로비)로 안내한다.\n2. MC의 위치·요청·진행 순서를 MC보조와 공유한다.","handoff":"도착 인원 특이사항을 현장 총괄·MC보조(1부-김소혜, 2부-김소연, 3부-이승민)에게 전달.","comms":"김소혜·홍주연 / 총괄 김윤수","cautions":"• MC 이동 및 진행 중 요청을 즉시 공유\n• 공연진을 불필요하게 분산시키지 않기","assigned":"11:30 공연진·MC 콜: 김소혜, 홍주연"},{"name":"식사·생수·케이터링 배부","category":"도착·지원","purpose":"공연진·스태프·조명팀·게스트에 배정된 식음료를 제공한다.","place":"케이터링 구역 / 수량표·음료·생수","prep":"• 배부 대상별 수량과 보관 장소 확인\n• 주문·수령 담당 안재우와 소통","steps":"1. 대상별로 식사와 생수를 배부한다.\n2. 미수령자와 부족 수량을 확인한다.\n3. 조명팀 식사 전달 등 별도 요청을 처리한다.\n4. 케이터링 구역 청결을 유지한다.","handoff":"남은 수량과 미배부 대상 보고 후 정리.","comms":"안재우(인포·회계)","cautions":"• 외부팀 수량을 먼저 임의 소진하지 않기\n• 음식물 쓰레기·누수 즉시 정리","assigned":"10:00 음료 주문·수령: 안재우\n11:30 공연진 점심·생수: 안재우, 조유빈, 임도규\n12:00 조명팀 식사·생수: 안재우\n14:00 게스트·촬영팀 음료 주문: 안재우\n16:00~16:20 게스트 케이터링: 김연우, 윤승현(안재우 가능 시 지원)"},{"name":"내부 리허설 총괄·큐콜","category":"기술·리허설","purpose":"제한된 리허설 시간을 지키고 무대별 진입·음향 준비를 조율한다.","place":"공연장 내부·FOH / 리허설 순서표","prep":"• 12:30 집결·공지 확인\n• 팀당 약 7분 배정(현장 상황에 따라 변동가능, 변동 시 안내)과 무대 순서 숙지","steps":"1. 현재 팀·다음 팀을 확인한다.\n2. 준비 완료 확인 후 큐콜로 시작을 지시한다.\n3. 음향·화면 이상과 동선 문제를 기록한다.\n4. 지연되면 즉시 스태프톡에 공유하고 다음 팀 호출 조정한다.","handoff":"미해결 기술 이슈를 공연 담당 기술팀에 인계.","comms":"김윤수·손민지 / FOH","cautions":"• 임의로 공연팀 순서를 변경하지 않기\n• 팀당 약 7분 목표, 현장 상황에 따라 총괄 지시 우선","assigned":"12:30경 전체 집결·공지: 김윤수, 손민지\n13:00~14:30 내부 리허설 총괄·큐콜: 김윤수, 손민지"},{"name":"리허설 음향·화면·AV 보조","category":"기술·리허설","purpose":"리허설에서 실제 공연과 같은 재생·화면 전환을 확인한다.","place":"FOH / 최종 음원·영상·큐시트 요청(담당자에게)","prep":"• 무대별 최종 파일 및 시작 위치 확인","steps":"1. 큐콜 신호에 맞춰 음원을 재생한다.\n2. 화면 담당은 영상·슬라이드 전환 타이밍을 확인한다.\n3. AV 보조는 다음 파일을 준비하고 이상 여부를 기록한다.\n4. 확인이 필요한 타이밍은 팀·큐콜 담당자에게 재확인한다.","handoff":"파일 오류 및 연출 변경사항을 기술 담당자에게 직접 전달.","comms":"큐콜 김윤수·손민지 / 변정암·엄지민·조성미","cautions":"• 음원 재생 및 화면 전환 타이밍 기록이 핵심\n• 임의로 파일을 교체하지 않기","assigned":"13:00~14:30 내부 공연진 리허설: 변정암(음향), 엄지민(화면), 조성미(AV보조)"},{"name":"리허설 순서 호출·입퇴장","category":"기술·리허설","purpose":"리허설 무대의 대기 공백과 이동 혼선을 줄인다.","place":"무대 출입구(하수) / 순서표","prep":"• 리허설 팀명과 대기 위치 숙지","steps":"1. 현재 팀 진행 중에 대기팀을 호출한다.\n2. 출연진 전원이 대기하는지 확인한다.\n3. 입장·퇴장 방향을 설명한다.\n4. 리허설 중 본 공연 담당 과업의 위치도 함께 점검한다.","handoff":"다음 호출 담당에게 현재 대기·누락 인원 전달.","comms":"리허설 큐콜 김윤수·손민지","cautions":"• 늦은 인원으로 인한 순서 임의 변경 금지\n• 문제 발견 즉시 총괄에게 공유","assigned":"13:00~14:30 내부 리허설: 김소혜, 김소연, 최대은, 홍주연\n15:20~16:00 게스트 리허설: 홍주연(주담당), 김윤수"},{"name":"리허설 영상 촬영·업로드","category":"기술·리허설","purpose":"모든 팀이 공연 전 영상으로 최종 점검할 수 있도록 기록한다.","place":"공연장 중앙·로비 / 촬영 기기·저장 공간","prep":"• 촬영 기기 배터리·저장공간·구도 확인","steps":"1. 객석 중앙의 무대 전체가 잘 보이는 위치에서 촬영한다.\n2. 팀별 촬영 파일을 공연 순서대로 구분한다.\n3. 14:30~14:50 사이 공연자 톡방에 업로드·공유한다.\n4. 누락·재생 오류가 없는지 확인한다.","handoff":"영상 업로드 시 공연자방 및 총괄에 공유.","comms":"정수인 / 김윤수","cautions":"• 업로드 시간에는 다른 업무보다 촬영본 공유를 우선\n• 촬영 중 관객·기술 스태프 동선 방해 금지","assigned":"13:00~14:30 촬영: 정수인\n14:30~14:50 영상 업로드·공유: 정수인"},{"name":"VIDEO·PHOTO 도착 케어","category":"외부팀","purpose":"영상·사진 담당자가 필요한 장소·동선을 빠르게 이해하도록 한다.","place":"로비·공연장 / 촬영 위치·식사·케이터링 안내","prep":"• 14:00 도착 예상 확인\n• 촬영 가능 구역 사전 정리","steps":"1. 담당자 도착 후 안내한다.\n2. 촬영 위치·대기 장소·식사·케이터링을 설명한다.\n3. 리허설 중 촬영 구도를 미리 확인하도록 요청한다.\n4. 촬영 장애 요소를 총괄과 조정한다.","handoff":"촬영 담당자 연락 및 요청사항을 총괄에 인계.","comms":"김윤수·정수인 중 가능자","cautions":"• 공연 관객 시야 방해 및 출입 통제 구역 촬영 주의\n• 장비 보관 장소 사전 확인","assigned":"14:00 촬영팀 콜: 김윤수, 안재우, 윤승현 중 가용 2명"},{"name":"게스트·퍼포스쿨 도착·대기 인솔","category":"외부팀","purpose":"외부 출연자가 대기·리허설·공연 동선을 혼동하지 않도록 한다.","place":"로비 → 대기실·객석 / 게스트별 순서·대기장소","prep":"• 15:00 외부팀 콜, 대기장소·식음료·리허설 순서 확인","steps":"1. 도착팀을 확인한다.\n2. 대기 장소와 식음료를 안내한다.\n3. 현재 진행 상황에 맞춰 리허설 장소로 인솔한다.\n4. 출연 직전에는 해당 팀 담당자와 입장 동선을 다시 확인한다.","handoff":"다음 담당자에게 팀 현재 위치·연락 가능 인원 전달.","comms":"안재우·김연우·윤승현","cautions":"• 외부팀 동선 변경을 즉흥적으로 지시하지 않기\n• 15:20~16:00 게스트 리허설 시간 우선 확보","assigned":"15:00 게스트·퍼포스쿨 도착 케어: 안재우, 김연우\n16:00~16:20 대기 장소 인솔·케이터링: 김연우, 윤승현(안재우 가능 시 지원)"},{"name":"게스트 리허설 순서·기술 진행","category":"외부팀","purpose":"외부팀의 무대 입퇴장·음향·화면을 당일 무대 조건에서 점검한다.","place":"공연장·백스테이지·FOH / 게스트 최종 음원","prep":"• SOUL→HOUSE→Break Ambition→REAL MANZ→VACCADI 순서 확인(현장 상황에 따라 조정 가능)","steps":"1. 다음 게스트팀을 미리 호출해 대기 상태를 확인한다.\n2. 큐콜과 음향·화면 담당이 함께 재생을 진행한다.\n3. 조명감독에게 현재 팀명·무대명을 명확히 알린다.\n4. 이동·음원 오류를 팀당 최대 약 7분 이내에 점검한다.","handoff":"문제 파일·변경사항을 FOH 기술팀과 공연 총괄에 공유.","comms":"손민지·홍주연·변정암·엄지민·조성미","cautions":"• 팀별 시간 지연 금지\n• 외부팀 입장 동선은 인솔 담당과 동기화","assigned":"15:20~16:00 게스트 리허설: 손민지(큐), 변정암(음향), 엄지민(화면), 조성미(AV보조)\n같은 구간 순서 호출·입퇴장: 홍주연(주담당), 김윤수"},{"name":"하우스 오픈 전 포지션 점검","category":"관객 응대","purpose":"16:30 관객 입장을 문제없이 시작할 수 있도록 각 지점을 최종 확인한다.","place":"인포·객석·입구·FOH / 좌석표·티켓 시트·팜플렛","prep":"• 16:00~16:20 인포·입장데스크 최종 점검\n• 16:20~16:30 위치 이동","steps":"1. 각 담당자가 지정 위치에 도착한다.\n2. 티켓 시트·잔여석·팜플렛·객석 동선·음향/화면 상태를 확인한다.\n3. 스태프톡에 '포지션 완료'를 보고한다.","handoff":"하우스 오픈 이후 개별 과업 담당으로 전환.","comms":"김윤수 총괄 / 인포 정수인·안재우","cautions":"• 준비가 덜 된 경우 그냥 입장 시작하지 않고 즉시 공유","assigned":"16:00~16:20 인포·입장데스크 점검: 정수인, 오서하, 이승민\n16:20~16:30 전체 포지션 이동·확인: 김윤수(총괄), 전 스태프"},{"name":"입장 줄 정리","category":"관객 응대","purpose":"로비 통행을 막지 않고 관객을 안정적으로 입장 처리 지점까지 안내한다.","place":"로비·입구 / 줄 표식·동선 안내","prep":"• 입장 처리 데스크 위치와 1줄/2처리 방식 확인","steps":"1. 관객을 하나의 대기열로 안내한다(현장 상황에 따라 운영진이 결정).\n2. 입장 확인 가능 지점이 2곳이면 앞쪽 관객을 빈 처리대로 차례로 안내한다.\n3. 줄 간격과 로비 일반 통행로를 유지한다.\n4. 지연·혼잡 발생 시 입구 처리 인원에 전달한다.","handoff":"후속 줄 관리 담당자에게 대기 인원·혼잡 상황 인계.","comms":"입장데스크 담당 → 김윤수·손민지","cautions":"• '2개 입장 처리'와 '대기열 2개'는 다름(대기열은 하나로 진행하지만 입장 처리를 두줄로 운영한다는 의미)\n• 줄 분리 여부는 현장 총괄 지시 우선","assigned":"16:30~17:10 관객 입장·공연 직전: 장민혁, 박민찬"},{"name":"티켓 확인·좌석별 입장 체크·팜플렛","category":"관객 응대","purpose":"유효한 예매 좌석을 사람별로 확인·체크하고 팜플렛을 제공한다.","place":"입구 / 관객 티켓·엑셀 예매명단·좌석표·팜플렛","prep":"• 두 처리대에서 같은 예매 시트 최신 내용 확인\n• 좌석번호 체크 담당과 좌석안내자 분담","steps":"1. 관객이 제시한 티켓의 예매 정보(예매자, 전화번호 뒷자리, 좌석번호)를 확인한다.\n2. 엑셀 명단에서 해당 티켓·좌석을 찾아 '해당 좌석'만 입장 체크한다.\n3. 대표자가 여러 장 예매한 경우 각 사람이 입장할 때 자신의 좌석번호를 말하게 하고 그 좌석만 별도로 체크한다.(Ex. A4(o) A4,A5(x)')\n4. 좌석을 안내하고 팜플렛을 1인당 전달한 뒤 입장시킨다.","handoff":"다음 체크 담당에게 미입장 좌석·문제 티켓을 전달.","comms":"티켓 이상 → 입장 담당끼리 확인 → 인포 안재우 → 필요 시 총괄 김윤수","cautions":"• 대표자 다매 예매를 한 번에 전원 입장 처리하지 않기\n• 이미 체크된 좌석은 재입장인지·중복인지 확인 후 처리\n• 확인 전 출입 허용 임의 결정 금지\n• 재입장 시 가볍게 티켓 확인만 하고 입장","assigned":"16:30~16:55 하우스 오픈: 정수인, 손민지, 홍주연, 윤승현(입장체크 2명, 팜플렛·좌석안내 2명)\n16:55~17:05 공연 직전: 홍주연, 오서하, 김서윤(홍주연은 17:05 하수 대기 통합 업무로 이동)\n17:05~17:10 공연 직전: 오서하, 김서윤(오서하는 17:10 통로로 이동)"},{"name":"객석 좌석 안내","category":"관객 응대","purpose":"관객을 예매된 행·열·좌석번호로 빠르게 안내하고 통행을 정리한다.","place":"객석 입구 및 객석 / 객석 좌석표","prep":"• 객석 행·열 번호와 통로 구조 파악!! 어리바리 xxxx","steps":"1. 티켓 또는 안내받은 좌석번호를 확인한다.\n2. 객석 배치도에 따라 해당 열·번호를 안내한다.\n3. 입장·착석 중 통로가 막히지 않게 유도한다.\n4. 잘못된 좌석 착석·좌석 분쟁은 확인 후 입구/인포에 공유한다.","handoff":"다음 객석 담당자에게 미해결 좌석 문의와 혼잡 구간을 전달.","comms":"객석 안내 → 인포 / 운영 총괄","cautions":"• 좌석 교환이나 이동을 스태프가 임의 승인하지 않기(일행 간 교환은 괜찮음)\n• 공연시작 후 입장(무대 안하고 있을 때만 입장)은 작게 말하기, 빠르고 정확하게 이동 시키기","assigned":"16:30~16:55 하우스 오픈: 정서연, 조성미, 김민기\n16:55~17:00 공연 직전: 정서연, 조성미(정서연은 17:00 여자 탈의실 이동)\n17:00~17:10 공연 직전: 조성미(17:10 FOH AV보조로 이동)\n1부 1-3 Get --out-- Off~1-5 Hipnotize(이벤트 포함): 백정욱, 최대은\n2부 2-1 이구동성: 조성미\n2부 2-2 어른여자힙합~2-5 RBKZ(이벤트 포함): 장민혁, 조성미"},{"name":"공연 중 지각 관객 입장관리","category":"관객 응대","purpose":"무대 중 이동으로 공연·촬영·기존 관객 관람을 방해하지 않게 한다.","place":"공연장 입구 / 현재 무대·MC 진행 상황","prep":"• 공연 순서 확인\n• 지각 입장 관객 문밖 대기 안내","steps":"1. 지각 관객은 입구에서 잠시 대기시킨다.\n2. 무대가 끝나도 MC가 중앙에 나와 멘트를 시작하지 않았다면 계속 대기한다.(문 열었다 닫았다 자주 하지 말고 주로 사운드로 체크)\n3. MC가 중앙에서 멘트하는 구간에만 담당자가 빠르게 입장시켜 착석을 돕는다.\n4. 다음 무대 시작 전에 이동 완료를 유도한다.","handoff":"교대자에게 다음 입장 가능 구간과 대기 인원 전달.","comms":"입장관리 ↔ 객석 안내 ↔ 큐콜/MC보조(스태프톡)","cautions":"• 무대 사이 짧은 음성 멘트만 나오는 구간은 입장 불가\n• 예: 반전세 후 MC 중앙 등장 및 멘트 없이 바로 It’s Break Time! 진행 시 두 무대 종료 및 MC 중앙 멘트까지 대기\n• 불가피한 예외는 카톡방 전달","assigned":"오프닝~1부 1-2 It’s Break Time!: 김윤수\n1부 1-3 Get --out-- Off~1-6 Break Ambition: 차수연\n1차 인터미션: 이승민, 김연우\n2부 2-1 이구동성: 김연우\n2부 2-2 어른여자힙합~2-6 REAL MANZ: 김민기\n2차 인터미션(19:02~19:19): 정수인, 이지호(윤승현은 의상 교체)\n3부 3-1 VACCADI~엔딩: 지각 관객 입장 전담 미지정(PDF 기준). 이지호는 인솔 담당이므로 현장 총괄에게 입장 방법 확인"},{"name":"인포데스크·현장예매","category":"관객 응대","purpose":"관객 문의를 처리하고 남은 좌석으로 현장예매를 정확히 등록한다.\n주차 등록 문의 시 확인 후 처리한다","place":"인포 / 예매 시트·잔여석 화면·계좌 안내·현장예매 10,000원","prep":"• 인포에 안내된 대표 계좌·입금확인 담당 확인\n• 최신 잔여석 확인\n• 주차 안내 숙지 및 주차 등록 방법 확인(당일 안내)","steps":"1. 현장예매 희망자에게 1매 10,000원을 인포에 적힌 대표계좌로 입금하도록 안내한다.\n2. 입금이 확인되면 잔여 좌석을 보여준다.\n3. 관객이 원하는 남은 좌석을 선택하도록 한다.\n4. 관리자 담당자가 예매 시트에 선택 좌석까지 직접 등록한다.\n5. 등록 여부를 확인한 뒤 입장데스크로 연결한다.\n6. 주차 등록 문의 시 바로 처리","handoff":"남은 좌석·미완료 문의를 다음 인포 담당에게 전달.","comms":"회계·인포 안재우 → 필요 시 김윤수·손민지","cautions":"• 입금 확인 전에 좌석 확정·입장 처리 금지\n• 현매 좌석 중복 등록 방지 위해 잔여석 실시간 확인 및 표기\n• 입금 확인 화면 꼭 확인하기!! ( 혹시 입금 내역확인 필요하면 카톡방에 남기기 )","assigned":"16:30~16:55 하우스 오픈: 안재우, 오서하, 김서윤\n16:55~1부 1-2 It’s Break Time!: 정다경(PDF 3쪽에 17:15 무대 준비 이동 안내, 4쪽 인포 담당 표시와 상충하므로 인계 확인)\n1부 1-3 Get --out-- Off~1-6 Break Ambition: 안재우, 최영서\n1차 인터미션~2부 2-1 이구동성: 안재우\n2부 2-2 어른여자힙합~3부 3-7 임원진 무대: 임도규, 조유빈"},{"name":"꽃다발·선물 접수 및 보관","category":"관객 응대","purpose":"공연 종료 후 관객이 맡긴 꽃다발을 정확하고 빠르게 찾도록 관리한다.","place":"인포 뒤 선반, 인포 옆 듀라테이블 상·하부 / 포스트잇·펜","prep":"• 꽃다발 접수 위치와 듀라테이블 수납 공간 확보","steps":"1. 접수 시 관객에게 '받는 사람 이름 + 좌석번호'를 확인한다.\n2. 포스트잇에 이름과 좌석번호를 모두 적어 꽃다발에 확실히 붙이고 미리 만들어둔 표에 포스트잇에 적은 정보를 수기작성\n3. 듀라테이블 위·아래를 열(행)·번호 순으로 정리한다.(당일 설정)\n4. 찾으러 온 사람의 이름·좌석번호를 대조하고 전달한다.","handoff":"인수인계 시 보관 위치·수량·미수령 선물 전달, 종료 시 남은 물품 확인.","comms":"인포 안재우 / 꽃다발 담당자 → 총괄","cautions":"• 포스트잇 분실·상품 혼동 방지\n• 물에 젖는 물품·케이크 등은 적절히 분리하여 안정적으로 보관\n• 찾아가지 않은 것들은 철수 시 전부 폐기","assigned":"16:30~16:55 인포: 안재우, 오서하, 김서윤\n16:55~1부 1-2 인포: 정다경\n1부 1-3~1-6 인포: 안재우, 최영서\n1차 인터미션~2부 2-1 인포: 안재우\n2부 2-2~3부 3-7 인포: 임도규, 조유빈\n엔딩~관객 퇴장 꽃다발 전달: 김소연, 문지윤, 서연우(퇴장 시 안재우 합류)"},{"name":"큐콜·현장진행 (FOH)","category":"공연 진행","purpose":"무대 대기·MC·음향·화면 상태를 확인하고 정확한 시작 타이밍을 지시한다.","place":"FOH(조정실) / 최종 큐시트·스태프톡","prep":"• 음향·화면 담당자와 함께 FOH에 위치\n• 담당 부의 무대·이벤트 순서 숙지","steps":"1. 다음 무대·출연진의 대기 완료 여부를 MC보조 및 하수 쪽 대기관리 인원과 카카오톡으로 계속 확인한다.\n2. 화면 function tabActive(section){document.querySelectorAll('[data-tab]').forEach(n=>{const is=n.dataset.tab===section;n.classList.toggle('active',is);if(is)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});}
function route(){let h=location.hash.slice(1)||'people',idx=h.indexOf('/');const page=idx<0?h:h.slice(0,idx),part=idx<0?'':h.slice(idx+1);let name='';try{name=decodeURIComponent(part)}catch{name=part}
 if(page==='person'){tabActive('people');personDetail(name)}else if(page==='manual'){tabActive('manuals');manualDetail(name)}else if(page==='manuals'){tabActive('manuals');manualsPage()}else if(page==='notice'){tabActive('notice');noticePage()}else{tabActive('people');peoplePage()}
 window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',route);route();
